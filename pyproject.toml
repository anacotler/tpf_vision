[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "age-estimation"
version = "0.1.0"
description = "Estimación de edad a partir de la cara (UTKFace) con demo en vivo y explicabilidad"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    # 4.x a proposito: OpenCV 5 dejo de traer los haarcascades (detector de respaldo).
    "opencv-python>=4.8,<5",
    "pillow>=10",
    "numpy>=1.24",
]

[project.optional-dependencies]
train = ["pandas", "scikit-learn", "tqdm", "torchmetrics", "tensorboard", "matplotlib", "timm", "prettytable"]

[tool.setuptools.packages.find]
where = ["src"]
